services:
  korosoft-wiki:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: korosoft-wiki
    restart: always
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      - PORT=8086
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8086/api/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
